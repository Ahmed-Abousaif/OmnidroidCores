name: RA Module Build and Release

on:
  push:
    tags:
      - "ra-v*"
  pull_request:
    paths:
      - "modules/omni_ra/**"
      - ".github/workflows/ra-module-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Module version (e.g. 1.0.0) for dry-run or manual release"
        required: false
        default: "1.0.0"

permissions:
  contents: write

jobs:
  host-tests:
    name: Host Unit Tests & Tooling Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with rcheevos submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and run C host tests
        run: |
          cmake -S modules/omni_ra -B build/host-ra -DOMNI_RA_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/host-ra --parallel
          ctest --test-dir build/host-ra --output-on-failure

      - name: Run Python tooling & core script tests
        run: |
          python3 -m pip install --quiet cryptography
          python3 -m unittest discover -s modules/omni_ra/tests -p "test_*.py" -v
          python3 -m unittest discover -s . -p "test_*.py" -v

  build-android:
    name: Build & Verify Android ABIs
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - name: Checkout repository with rcheevos submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Android NDK 29 and CMake
        uses: android-actions/setup-android@v3
      - run: sdkmanager 'ndk;29.0.14206865' 'cmake;3.30.5'

      - name: Resolve version metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/ra-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/ra-v}"
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ github.event.inputs.version || '1.0.0' }}"
            TAG="ra-v${VERSION}"
          fi
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build, verify ELF hygiene, archive symbols, and strip ABIs
        env:
          NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: |
          CMAKE_BIN="${ANDROID_HOME}/cmake/3.30.5/bin/cmake"
          READELF="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          STRIP="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          mkdir -p dist/artifacts dist/symbols
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            BUILD_DIR="build/android-${ABI}"
            "${CMAKE_BIN}" -S modules/omni_ra -B "${BUILD_DIR}" \
              -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="${NDK_ROOT}/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="${ABI}" \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release \
              -DOMNI_RA_VERSION="${{ steps.meta.outputs.version }}" \
              -DOMNI_RA_GIT_HASH="${{ steps.meta.outputs.sha }}"
            "${CMAKE_BIN}" --build "${BUILD_DIR}"
            python3 modules/omni_ra/scripts/verify_elf.py --readelf "${READELF}" "${BUILD_DIR}/libomnidroid_ra.so"
            mkdir -p "dist/symbols/${ABI}" "dist/artifacts/${ABI}"
            cp "${BUILD_DIR}/libomnidroid_ra.so" "dist/symbols/${ABI}/libomnidroid_ra.so"
            cp "${BUILD_DIR}/libomnidroid_ra.so" "dist/artifacts/${ABI}/libomnidroid_ra.so"
            "${STRIP}" --strip-unneeded "dist/artifacts/${ABI}/libomnidroid_ra.so"
            python3 modules/omni_ra/scripts/verify_elf.py --readelf "${READELF}" "dist/artifacts/${ABI}/libomnidroid_ra.so"
          done
          tar -czf "dist/libomnidroid_ra-symbols-${{ steps.meta.outputs.version }}.tar.gz" -C dist/symbols .

      - name: Unsigned manifest dry-run verification
        if: "!startsWith(github.ref, 'refs/tags/ra-v')"
        run: |
          python3 modules/omni_ra/scripts/update_manifest.py \
            --manifest dist/manifest.json \
            --module-version "${{ steps.meta.outputs.version }}" \
            --release-tag "${{ steps.meta.outputs.tag }}" \
            --artifacts-dir dist/artifacts \
            --symbols-file "dist/libomnidroid_ra-symbols-${{ steps.meta.outputs.version }}.tar.gz"

      - name: Upload dry-run artifacts
        if: "!startsWith(github.ref, 'refs/tags/ra-v')"
        uses: actions/upload-artifact@v4
        with:
          name: omni_ra-android-${{ steps.meta.outputs.version }}
          path: dist/

      - name: Sign artifacts, update manifest, and publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/ra-v')
        env:
          OMNI_RA_ED25519_PRIVATE_KEY: ${{ secrets.OMNI_RA_ED25519_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m pip install --quiet cryptography
          test -n "${OMNI_RA_ED25519_PRIVATE_KEY}"
          if [[ -f manifest.json ]]; then cp manifest.json dist/manifest.json; fi
          python3 modules/omni_ra/scripts/update_manifest.py \
            --manifest dist/manifest.json \
            --repo-slug "${{ github.repository }}" \
            --module-version "${{ steps.meta.outputs.version }}" \
            --release-tag "${{ steps.meta.outputs.tag }}" \
            --artifacts-dir dist/artifacts \
            --symbols-file "dist/libomnidroid_ra-symbols-${{ steps.meta.outputs.version }}.tar.gz" \
            --sign

          RELEASE_ASSETS="dist/upload"
          mkdir -p "${RELEASE_ASSETS}"
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            cp "dist/artifacts/${ABI}/libomnidroid_ra.so" "${RELEASE_ASSETS}/libomnidroid_ra-android-${ABI}.so"
          done
          cp "dist/libomnidroid_ra-symbols-${{ steps.meta.outputs.version }}.tar.gz" "${RELEASE_ASSETS}/"
          cp dist/manifest.json dist/manifest.json.sig "${RELEASE_ASSETS}/"

          gh release create "${{ steps.meta.outputs.tag }}" "${RELEASE_ASSETS}"/* \
            --title "RetroAchievements Module ${{ steps.meta.outputs.version }}" \
            --notes "rcheevos v12.5.0 native module release (ABI v1.0)." || \
          gh release upload "${{ steps.meta.outputs.tag }}" "${RELEASE_ASSETS}"/* --clobber

          gh release view ra-manifest >/dev/null 2>&1 || \
            gh release create ra-manifest --title "OmnidroidCores Manifest" --notes "Latest signed module and core RA manifest."
          gh release upload ra-manifest dist/manifest.json dist/manifest.json.sig --clobber
